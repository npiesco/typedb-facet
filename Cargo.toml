[workspace]
members = [
    "crates/facet-core",
    "crates/facet-e2e",
    "crates/facet-server",
    "crates/facet-state",
    "crates/facet-typedb",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MPL-2.0"
rust-version = "1.97"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1.89"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.0", features = ["derive"] }
facet-core = { path = "crates/facet-core" }
facet-state = { path = "crates/facet-state" }
facet-typedb = { path = "crates/facet-typedb" }
futures = "0.3.32"
pgwire = { version = "=0.40.7", default-features = false, features = ["server-api-ring"] }
rand = "0.10.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.0", features = ["bundled"] }
rust_decimal = { version = "1.40.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sqlparser = { version = "0.61.0", default-features = false }
tempfile = "3.23"
thiserror = "2.0.18"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "0.9.11"
